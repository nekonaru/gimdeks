name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GimDeks.slnx

      - name: Dependency audit
        shell: pwsh
        run: |
          $json = dotnet list package --vulnerable --include-transitive --format json 2>&1 | Out-String
          Write-Host $json
          try { $doc = $json | ConvertFrom-Json } catch {
            Write-Error "Could not parse the vulnerability report. Failing the release."
            exit 1
          }
          $vulnerable = 0
          foreach ($project in @($doc.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($section in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                foreach ($package in @($section)) {
                  if ($package.vulnerabilities) { $vulnerable += @($package.vulnerabilities).Count }
                }
              }
            }
          }
          if ($vulnerable -gt 0) {
            Write-Error "$vulnerable vulnerable package finding(s). Failing the release."
            exit 1
          }

      - name: Test
        run: dotnet test tests/GimDeks.Tests/GimDeks.Tests.csproj --configuration Release

      - name: Publish single-file win-x64
        run: >
          dotnet publish src/GimDeks.App/GimDeks.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output out/publish

      - name: Package artifact and checksum
        shell: pwsh
        run: |
          if (-not (Test-Path out/publish/GimDeks.exe)) { throw "GimDeks.exe not found in publish output" }
          Compress-Archive -Path out/publish/GimDeks.exe, out/publish/assets -DestinationPath out/GimDeks-win-x64.zip
          $hash = (Get-FileHash out/GimDeks-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "GimDeks-win-x64.zip  $hash" | Out-File out/SHA256SUMS.txt -Encoding ascii

      - name: Build release notes from changelogs
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $en = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $id = Get-Content CHANGELOG.id.md -Raw -Encoding utf8
          function Get-Section($content, $ver) {
            $pattern = '(?ms)^## v' + [regex]::Escape($ver) + '\s*$(.*?)(?=^## v|\z)'
            $m = [regex]::Match($content, $pattern)
            if (-not $m.Success) { throw "Section v$ver not found in changelog" }
            return $m.Groups[1].Value.Trim()
          }
          $enBody = Get-Section $en $version
          $idBody = Get-Section $id $version
          $install = @"
          ## Install / Update

          Download ``GimDeks-win-x64.zip`` from Assets below, extract it anywhere (it contains ``GimDeks.exe`` and an ``assets`` folder; keep both together), then run ``GimDeks.exe``. Verify the zip with ``Get-FileHash -Algorithm SHA256`` against ``SHA256SUMS.txt``. Requires Windows 10 version 1809 or later, or Windows 11 (x64).

          <br>

          ---

          <br>

          ## Instalasi / Update

          Unduh ``GimDeks-win-x64.zip`` dari Assets di bawah, ekstrak ke mana pun (berisi ``GimDeks.exe`` dan folder ``assets``; simpan keduanya bersama-sama), lalu jalankan ``GimDeks.exe``. Verifikasi zip dengan ``Get-FileHash -Algorithm SHA256`` terhadap ``SHA256SUMS.txt``. Membutuhkan Windows 10 versi 1809 atau lebih baru, atau Windows 11 (x64).
          "@
          $body = "# English`n`n$enBody`n`n<br>`n`n---`n`n<br>`n`n# Bahasa Indonesia`n`n$idBody`n`n<br>`n`n---`n`n<br>`n`n$install"
          Set-Content -Path out/release-notes.md -Value $body -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: GimDeks ${{ github.ref_name }}
          body_path: out/release-notes.md
          files: |
            out/GimDeks-win-x64.zip
            out/SHA256SUMS.txt
