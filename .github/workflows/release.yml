name: Release

on:
  push:
    tags: ["v*"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GimDeks.slnx

      - name: Test
        run: dotnet test tests/GimDeks.Tests/GimDeks.Tests.csproj --configuration Release

      - name: Publish single-file win-x64
        run: >
          dotnet publish src/GimDeks.App/GimDeks.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output out/publish

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path out/publish/GimDeks.exe -DestinationPath out/GimDeks-win-x64.zip

      - name: Build release notes from changelogs
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $en = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $id = Get-Content CHANGELOG.id.md -Raw -Encoding utf8
          function Get-Section($content, $ver) {
            $pattern = "(?ms)^## v$([regex]::Escape($ver))\s*$(.*?)(?=^## v|\z)"
            $m = [regex]::Match($content, $pattern)
            if (-not $m.Success) { throw "Section v$ver not found in changelog" }
            return $m.Groups[1].Value.Trim()
          }
          $enBody = Get-Section $en $version
          $idBody = Get-Section $id $version
          $install = @"
          ## Install / Update

          Download ``GimDeks-win-x64.zip`` from Assets below, extract ``GimDeks.exe`` and run it. Requires Windows 10 version 1809 or later, or Windows 11 (x64).

          <br>

          ---

          <br>

          ## Instalasi / Update

          Unduh ``GimDeks-win-x64.zip`` dari Assets di bawah, ekstrak ``GimDeks.exe``, lalu jalankan. Membutuhkan Windows 10 versi 1809 atau lebih baru, atau Windows 11 (x64).
          "@
          $body = "# English`n`n$enBody`n`n<br>`n`n---`n`n<br>`n`n# Bahasa Indonesia`n`n$idBody`n`n<br>`n`n---`n`n<br>`n`n$install"
          Set-Content -Path out/release-notes.md -Value $body -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GimDeks ${{ github.ref_name }}
          body_path: out/release-notes.md
          files: out/GimDeks-win-x64.zip

