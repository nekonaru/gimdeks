name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GimDeks.slnx

      - name: Build
        run: dotnet build GimDeks.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/GimDeks.Tests/GimDeks.Tests.csproj
          --configuration Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=75
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Exclude="[GimDeks.App]*"

      - name: Dependency audit
        shell: pwsh
        run: |
          $json = dotnet list package --vulnerable --include-transitive --format json 2>&1 | Out-String
          Write-Host $json
          try { $doc = $json | ConvertFrom-Json } catch {
            Write-Error "Could not parse the vulnerability report. Failing the build."
            exit 1
          }
          $vulnerable = 0
          foreach ($project in @($doc.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($section in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                foreach ($package in @($section)) {
                  if ($package.vulnerabilities) { $vulnerable += @($package.vulnerabilities).Count }
                }
              }
            }
          }
          if ($vulnerable -gt 0) {
            Write-Error "$vulnerable vulnerable package finding(s). Failing the build."
            exit 1
          }

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
