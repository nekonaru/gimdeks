name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GimDeks.slnx

      - name: Build
        run: dotnet build GimDeks.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/GimDeks.Tests/GimDeks.Tests.csproj
          --configuration Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=60
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Exclude="[GimDeks.App]*"

      - name: Dependency audit
        shell: pwsh
        run: |
          $out = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match "has the following vulnerable packages") {
            Write-Error "Vulnerable packages found. Failing the build."
            exit 1
          }

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
